<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Example</title>

    3

    <style>
        .image {
            float: left;
            width: 150px;
            margin-right: 20px;
        }

        .text {
            font-size: 1rem;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div>
        <img src="https://itcollege.lviv.ua/wp-content/uploads/2022/01/logo-lit.jpg" alt="Приклад" class="image">
        <p class="text">
            Властивість <strong>float</strong> дозволяє елементу "плавати"
            ліворуч або праворуч, і текст обтікає його з протилежного боку. У цьому
            прикладі зображення плаває ліворуч, а текст розташовується праворуч.
        </p>
    </div>
</body>

</html>
