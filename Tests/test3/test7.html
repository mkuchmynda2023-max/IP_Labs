<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
initial-scale=1.0">
    <title>Layered Layout Example</title>
    <style>
        .layer1 {
            position: relative;
            background-color: lightblue;
            width: 200px;
            height: 200px;
            z-index: 1;
        }

        .layer2 {
            position: relative;
            background-color: lightcoral;
            width: 150px;
            height: 150px;
            top: -50px;
            left: 30px;
            z-index: 2;
        }

        .layer3 {
            position: relative;
            background-color: lightgreen;
            width: 100px;
            height: 100px;
            top: -100px;
            left: 60px;
            z-index: 3;
        }
    </style>
</head>

19

<body>
    <div class="layer1">Layer 1</div>
    <div class="layer2">Layer 2</div>
    <div class="layer3">Layer 3</div>
</body>

</html>
