<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roboto Font Example</title>

    <!-- Підключення шрифту Roboto з Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Isometra&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Isometra&family=Playwrite+CA+Guides&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Isometra', sans-serif;
            /* Використання шрифту Isometra */
        }

        h1 {
            font-weight: 700;
            /* Напівжирний варіант шрифту */
        }

        p {
            font-weight: 400;
            font-size: 26px;
            /* Звичайний варіант шрифту */
            font-family: 'Playwrite CA Guides', sans-serif;
        }
    </style>
</head>

<body>
    <h1>Заголовок з шрифтом Isometra</h1>
    <p>Це приклад використання шрифту Playwrite CA Guides, завантаженого з Google
        Fonts.</p>

</body>

</html>
