<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .box-model-example {
            /* Розміри вмісту */
            width: 250px;
            height: 150px;

            /* Відступи */
            padding: 20px 15px;
            /* Відступи: 20px зверху та знизу, 15px з боків*/

            /* Рамка */
            border: 5px solid #3498db;
            /* Рамка: 5px, суцільна лінія, блакитний колір */

            /* Зовнішні відступи */
            margin: 30px 50px;
            /* Зовнішні відступи: 30px зверху і знизу, 50px з боків */

            /* Фоновий колір для візуалізації */
            background-color: #f0e68c;
        }
    </style>
</head>

<body>
    <div class="box-model-example">
        Приклад використання CSS Box Model
    </div>
</body>

</html>
